<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
<title id="t">ChainMemoir memory trace</title>
<desc id="d">A vertical time trace crossed by a flowing memory ribbon above evidence ripples.</desc>
<defs>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F4C2FF" stop-opacity="0"/>
    <stop offset=".18" stop-color="#F4C2FF" stop-opacity=".55"/>
    <stop offset=".48" stop-color="#FFFFFF"/>
    <stop offset=".64" stop-color="#F4C2FF" stop-opacity=".82"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A855F7" stop-opacity=".12"/>
    <stop offset=".28" stop-color="#C084FC" stop-opacity=".64"/>
    <stop offset=".54" stop-color="#FFFFFF" stop-opacity=".94"/>
    <stop offset=".72" stop-color="#F4C2FF" stop-opacity=".74"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity=".16"/>
  </linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".24" stop-color="#F4C2FF"/>
    <stop offset=".58" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="floor" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F4C2FF" stop-opacity=".46"/>
    <stop offset=".42" stop-color="#A855F7" stop-opacity=".18"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
  
</defs>
<circle cx="128" cy="108" r="71" fill="none" stroke="#F4C2FF" stroke-opacity=".28" stroke-width="1.15"/>
<g>
  <rect x="126.85" y="20" width="2.3" height="214" rx="1.15" fill="url(#beam)" filter="url(#glow)"/>
  <rect x="127.55" y="34" width=".9" height="194" fill="#FFFFFF" opacity=".68"/>
</g>
<g filter="url(#glow)">
  <path d="M80 171 C96 151 111 145 131 132 C154 117 169 96 168 77 C168 62 160 51 151 43 C165 51 176 62 178 77 C182 104 161 127 137 141 C111 156 98 169 92 185 C86 199 88 211 95 219 C82 209 74 195 76 183 C76 179 77 175 80 171 Z" fill="url(#ribbon)" opacity=".88"/>
  <path d="M86 173 C105 152 123 143 143 128 C163 113 171 94 169 78 C168 68 164 58 158 51" fill="none" stroke="#F4C2FF" stroke-opacity=".76" stroke-width="1.7" stroke-linecap="round"/>
</g>
<g filter="url(#glow)">
  <circle cx="128" cy="125" r="18" fill="url(#core)" opacity=".72"/>
  <path d="M128 111V139 M114 125H142" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".84"/>
  <circle cx="128" cy="125" r="3.6" fill="#FFFFFF"/>
</g>
<g fill="#F4C2FF">
  <circle cx="74" cy="76" r="1.8"/><circle cx="92" cy="53" r="1.1"/><circle cx="110" cy="67" r="1.5"/>
  <circle cx="151" cy="66" r="1.2"/><circle cx="182" cy="93" r="1.7"/><circle cx="194" cy="117" r="1.0"/>
  <circle cx="76" cy="118" r="1.1"/><circle cx="164" cy="155" r="1.2"/>
</g>
<ellipse cx="128" cy="205" rx="69" ry="10.5" fill="url(#floor)" opacity=".32" filter="url(#soft)"/>
<g fill="none" stroke-linecap="round">
  <ellipse cx="128" cy="205" rx="63" ry="9.5" stroke="#C084FC" stroke-opacity=".55" stroke-width="1.15"/>
  <ellipse cx="128" cy="205" rx="43" ry="6.4" stroke="#F4C2FF" stroke-opacity=".48" stroke-width="1.05"/>
  <ellipse cx="128" cy="205" rx="24" ry="3.9" stroke="#FFFFFF" stroke-opacity=".44" stroke-width=".8"/>
</g>
<path d="M128 205V240" stroke="url(#beam)" stroke-width="1.6" opacity=".48" filter="url(#glow)"/>
</svg>